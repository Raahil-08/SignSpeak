[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-recognition"
version = "1.0.0"
description = "Real-time American Sign Language Recognition System"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Pratham"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

# Minimal dependencies for production/Vercel deployment
dependencies = [
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "opencv-python>=4.5.0",
    "mediapipe>=0.8.9",
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",
    "joblib>=1.0.0",
    "python-dotenv>=0.19.0",
    "Werkzeug>=2.0.0",
]

[project.optional-dependencies]
# Full development dependencies
dev = [
    # ML/DL - only needed for training
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pandas>=1.3.0",
    "ultralytics>=8.0.0",
    
    # Monitoring
    "prometheus-flask-exporter>=0.18.0",
    "python-json-logger>=2.0.0",
    
    # Visualization
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
    
    # Testing & linting
    "pytest>=6.2.0",
    "black>=21.5b2",
    "flake8>=3.9.0",
    "isort>=5.9.0",
]

security = [
    "pyOpenSSL>=20.0.0",
    "flask-talisman>=1.0.0",
    "flask-limiter>=3.3.0",
]

server = [
    "gunicorn>=20.1.0",
]

[project.scripts]
asl-server = "server.App:main"

[tool.setuptools]
packages = ["server", "Scripts", "ISL", "Isign", "sign_nlp"]
